<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Right &amp; Left · Event</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,300..700&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#000; --navy-2:#1c1c1c; --ivory:#fff; --paper:#fff; --sand:#f0f2f1;
  --line:#e2e4e3; --muted:#6d7372; --gold:#4f8786; --teal:#69a1a0; --teal-dark:#2b6664; --teal-soft:#e7f0f0; --coral:#e4e3df; --coral-dark:#cdcac3; --danger:#a3322b; --ok:#3f7d5a;
  --r:14px; --font:"Archivo","IBM Plex Sans Arabic",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--ivory);color:var(--navy);font-family:var(--font);font-stretch:112%;font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased}
.ar,[lang=ar]{font-family:"IBM Plex Sans Arabic",Archivo,sans-serif}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
[hidden]{display:none!important}

/* header */
header{position:sticky;top:0;z-index:10;background:rgba(255,255,255,.94);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  padding:calc(env(safe-area-inset-top) + 10px) calc(env(safe-area-inset-right) + 16px) 10px calc(env(safe-area-inset-left) + 16px);
  display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;min-height:38px;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.brand .logo{height:30px;width:auto;display:block;color:#000}
.brand img{height:34px;max-width:170px;object-fit:contain;display:block}
.hbtns{display:flex;align-items:center;gap:4px}
.icon{width:40px;height:40px;border-radius:50%;border:0;background:transparent;display:grid;place-items:center;color:var(--navy)}
.icon:active{background:var(--sand)}
.icon svg{width:21px;height:21px}
.dot{width:8px;height:8px;border-radius:50%;background:#b9b3a7;margin-right:6px}
.dot.ok{background:var(--ok)} .dot.syncing,.dot.slow{background:#d4a548} .dot.err{background:var(--danger)}

main{max-width:760px;margin:0 auto;padding:18px calc(env(safe-area-inset-right) + 18px) calc(110px + env(safe-area-inset-bottom)) calc(env(safe-area-inset-left) + 18px)}
.hero{text-align:center;margin:6px 0 24px}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);margin:0 0 8px}
h1{font-family:var(--font);font-weight:700;font-size:30px;line-height:1.08;letter-spacing:-.02em;margin:0 0 6px}
h2{font-family:var(--font);font-weight:700;font-size:22px;letter-spacing:-.01em;margin:0}
.sub{color:var(--muted);margin:0}

/* form */
.card-form{background:transparent;border:0;padding:4px 2px 0}
.band{position:relative;overflow:hidden;border-radius:18px;padding:30px 22px 26px;margin:0 0 26px;color:#fff;min-height:150px;display:flex;flex-direction:column;justify-content:flex-end}
.band.teal{background:var(--teal)} .band.teal .flourish{color:var(--teal-dark)}
.band.coral{background:var(--coral)} .band.coral .flourish{color:var(--coral-dark)}
.band .flourish{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:440px;height:440px;pointer-events:none}
.band h1{position:relative;color:#fff;font-size:34px;margin:0;letter-spacing:-.03em}
.band p{position:relative;margin:4px 0 0;font-size:14px;opacity:.92;font-weight:500}
label,.fieldlabel{display:block;font-weight:500;font-size:14px;margin:0 0 6px}
label span,.fieldlabel span{color:var(--muted);font-weight:400;margin-left:6px;font-family:"IBM Plex Sans Arabic",sans-serif}
label em,.fieldlabel em{float:right;font-style:normal;font-size:12px;color:var(--muted);font-weight:400}
.field{margin-bottom:18px}
input[type=text],input[type=tel],input[type=number],input[type=password],input[type=search],textarea{
  width:100%;border:1px solid var(--line);background:#fff;border-radius:12px;padding:14px 14px;font-size:17px;outline:none;transition:border .15s}
textarea{resize:vertical;min-height:84px}
input:focus,textarea:focus{border-color:var(--navy)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:9px 14px;font-size:14px}
.chip.on{background:var(--navy);border-color:var(--navy);color:#fff}
.err{color:var(--danger);font-size:14px;min-height:1em;margin:0 0 10px}

.btn{border:0;border-radius:12px;padding:12px 18px;font-weight:500;font-size:15px;display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--sand);color:var(--navy)}
.btn.primary{background:var(--navy);color:#fff}
.btn.primary:active{background:var(--navy-2)}
.btn.ghost{background:transparent;border:1px solid var(--line)}
.btn.danger{background:var(--danger);color:#fff}
.btn.big{width:100%;padding:17px;font-size:17px;border-radius:14px}
.btn.sm{padding:9px 14px;font-size:14px;border-radius:10px}
.btn:disabled{opacity:.35}
.btnrow{display:flex;gap:10px;margin-top:18px}
.btnrow .btn{flex:1}

/* menu */
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
@media(min-width:620px){.grid{grid-template-columns:repeat(3,1fr)}}
.pcard{background:transparent;border:0;border-radius:0;overflow:visible;position:relative}
.pcard .cimg{border-radius:14px}
.cimg{width:100%;aspect-ratio:3/5;object-fit:cover;object-position:center top;display:block;background:var(--sand)}
.mono{display:grid;place-items:center;background:var(--teal);color:#fff}
.mono span{font-family:var(--font);font-weight:800;font-size:30px;letter-spacing:-.02em}
.pbody{padding:10px 2px 6px}
.pbody h3{font-family:var(--font);font-weight:700;font-size:17px;letter-spacing:-.01em;margin:0 0 2px;line-height:1.15}
.price{margin:0;font-weight:500}
.price small{color:var(--muted);font-weight:400;font-size:12px}
.price .was{color:var(--muted);font-weight:400;margin-right:2px}
.sizes{margin:6px 0 0;font-size:11px;color:var(--muted)}
.sizes b{display:block;font-size:13px;color:var(--navy);font-weight:500;margin-top:1px}
.szs{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.sz{font-size:11px;background:var(--teal-soft);color:#3f6e6d;border-radius:6px;padding:2px 6px;font-weight:500}
.sz.gone{background:#f3f3f3;color:#b5b5b5;text-decoration:line-through}
.count.left{justify-content:center;height:34px;padding:0 10px}
.chip.big{padding:12px 20px;font-size:17px}
.badge{position:absolute;top:10px;left:10px;background:rgba(255,253,249,.94);color:var(--navy);font-size:11px;letter-spacing:.06em;padding:5px 9px;border-radius:999px;font-weight:500}
.badge.out{background:var(--navy);color:#fff}
.badge.new{background:var(--teal);color:#fff}
.pcard.soldout .cimg{filter:grayscale(.6) opacity(.7)}

/* stock */
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:22px}
.tile{background:var(--navy);color:#fff;border-radius:var(--r);padding:14px 12px}
.tile b{display:block;font-family:var(--font);font-size:28px;font-weight:700;letter-spacing:-.02em;line-height:1}
.tile span{font-size:12px;opacity:.75;letter-spacing:.04em}
.tile.teal{background:var(--teal)}
.tile.light{background:var(--paper);color:var(--navy);border:1px solid var(--line)}
.row-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 0 12px}
.srow{display:grid;grid-template-columns:56px 1fr auto;gap:12px;align-items:center;background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:10px;margin-bottom:10px}
.srow.out{opacity:.6}
.sthumb{width:56px;height:84px;border-radius:10px;object-fit:cover;object-position:center top;background:var(--sand)}
.sthumb.mono{background:var(--teal)}
.sthumb.mono span{font-size:18px}
.sinfo{min-width:0}
.sinfo b{display:block;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sinfo small{color:var(--muted);display:block;font-size:13px}
.linkbtn{background:none;border:0;padding:4px 0 0;color:var(--gold);font-size:13px;text-decoration:underline;text-underline-offset:3px}
.sctl{display:flex;flex-direction:column;align-items:stretch;gap:6px}
.count{display:flex;align-items:center;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff}
.count button{width:36px;height:34px;border:0;background:transparent;font-size:19px}
.count button:active{background:var(--sand)}
.count output{min-width:32px;text-align:center;font-weight:600;font-variant-numeric:tabular-nums}
.empty{text-align:center;color:var(--muted);padding:30px 10px;border:1px dashed var(--line);border-radius:var(--r)}
details.box{margin-top:26px;background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:4px 14px}
details.box summary{padding:12px 0;font-weight:500;list-style:none;display:flex;justify-content:space-between}
details.box summary::-webkit-details-marker{display:none}
.sale{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line);font-size:14px}
.sale .t{color:var(--muted);width:56px;font-variant-numeric:tabular-nums}
.sale .n{flex:1}
.sale button{border:0;background:none;color:var(--danger);font-size:13px}

/* customers */
.search{margin-bottom:14px}
.ccard{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:10px}
.ctop{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.ctop b{font-weight:500;font-size:17px}
.when{color:var(--muted);font-size:12px;white-space:nowrap}
.cphone{font-variant-numeric:tabular-nums;color:var(--navy-2);margin:2px 0 6px;letter-spacing:.02em}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0}
.tag{background:var(--sand);border-radius:999px;padding:3px 10px;font-size:12px}
.tag.gold{background:var(--teal-soft);color:#3f6e6d}
.cnotes{margin:8px 0 0;padding:10px 12px;background:#f5f8f8;border-left:3px solid var(--gold);border-radius:6px;font-size:14px;white-space:pre-wrap}
.cact{display:flex;gap:16px;margin-top:10px;font-size:13px}
.cact button,.cact a{background:none;border:0;padding:0;color:var(--gold);text-decoration:underline;text-underline-offset:3px}

/* tabs */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--navy);display:flex;justify-content:center;padding:0 env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
nav.tabs .in{display:flex;width:100%;max-width:760px}
nav.tabs button{flex:1;border:0;background:none;color:rgba(255,255,255,.55);padding:11px 2px 10px;font-size:11.5px;letter-spacing:.04em;display:flex;flex-direction:column;align-items:center;gap:4px}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button.on{color:#fff}
nav.tabs button.on::after{content:"";width:4px;height:4px;border-radius:50%;background:var(--teal);margin-top:1px}

/* modal */
.modal{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:#fff;width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:22px 18px calc(22px + env(safe-area-inset-bottom))}
@media(min-width:620px){.modal{align-items:center}.sheet{border-radius:22px}}
.sheet h3{font-family:var(--font);font-size:22px;font-weight:700;letter-spacing:-.01em;margin:0 0 16px}
.sheet p{margin:0 0 14px}
.photo{display:flex;gap:14px;align-items:center;margin-bottom:18px}
.photo .sthumb{width:72px;height:90px}
.filebtn{position:relative;overflow:hidden}
.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer}
.toggle{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.toggle input{width:22px;height:22px;accent-color:var(--navy)}
.pin{letter-spacing:.6em;text-align:center;font-size:26px!important}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.note{font-size:13px;color:var(--muted)}

/* thanks */
.thanks{position:fixed;inset:0;z-index:40;background:var(--coral);color:#000;display:flex;flex-direction:column;align-items:center;justify-content:space-between;text-align:center;padding:calc(env(safe-area-inset-top) + 56px) 30px calc(env(safe-area-inset-bottom) + 48px);animation:fade .3s}
.thanks .mid{display:flex;flex-direction:column;align-items:center}
.thanks .tagline{margin:0;font-size:17px;font-weight:500;letter-spacing:-.01em;opacity:1}
.thanks .logo{width:150px;height:auto;color:#000}
.thanks img{max-height:70px;max-width:200px}
.thanks h1{font-size:40px;color:#fff}
.thanks p{opacity:.8;margin:6px 0}
@keyframes fade{from{opacity:0}to{opacity:1}}

#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);opacity:0;pointer-events:none;background:var(--navy-2);color:#fff;border-radius:12px;padding:12px 16px;font-size:14px;display:flex;gap:14px;align-items:center;transition:.2s;z-index:35;max-width:calc(100% - 32px)}
#toast.show{opacity:1;transform:translateX(-50%);pointer-events:auto}
#toast button{background:none;border:0;color:#9fd0cf;font-weight:600;padding:0}

/* ---- brand typography ---- */
body,button,input,textarea{font-stretch:112%}
h1,h2,h3,.band h1,.pbody h3,.sheet h3,.tile b{font-family:var(--font);font-stretch:115%;font-weight:500;letter-spacing:-.01em}
.band h1{font-size:26px;line-height:1.1}
.band p{font-size:13px;font-weight:400;letter-spacing:0}
.band{min-height:150px;padding:0}
h2{font-size:19px}
.pbody h3{font-size:14px;font-weight:500;margin-bottom:3px}
.price{font-size:14px;font-weight:400}
.sizes,.sizes b{font-size:12px}
.sizes b{font-weight:400}
.tile b{font-size:24px}
.tile span{font-size:11px;letter-spacing:.02em}
.sheet h3{font-size:19px}
label,.fieldlabel{font-size:13px;font-weight:500}
input[type=text],input[type=tel],input[type=number],input[type=password],input[type=search],textarea{font-size:16px;padding:13px 14px}
.chip{font-size:13px;padding:8px 13px}
.btn{font-weight:500;font-size:14px}
.btn.big{font-size:15px;padding:16px;letter-spacing:.01em}
.badge{font-size:10.5px;font-weight:500;letter-spacing:.02em}
nav.tabs button{font-size:11px;letter-spacing:.02em}
.sinfo b{font-weight:500;font-size:14px}
.ctop b{font-weight:500;font-size:15px}
.thanks h1{font-size:30px;font-weight:500;font-stretch:115%;color:#000}
.thanks .tagline{font-size:15px;font-weight:400}
.wordmark{display:none}
</style>
</head>

let be=null; const chains={}; const recentDel={};
function setSync(st){
  const d=$('#syncdot'); d.className='dot '+st;
  d.title={ok:be&&be.name==='sheet'?'Saved to your Google Sheet':'Saved to your account',syncing:'Connecting…',slow:'Offline — saved on this device, will sync',err:'Cloud save problem — kept on this device',local:'Saved on this device only'}[st]||'';
}
function clean(o){const r=Object.assign({},o);delete r._pending;return r;}
function markPending(c,id,v){if(S[c][id]){S[c][id]=Object.assign({},S[c][id],{_pending:v});if(!v)delete S[c][id]._pending;saveLocal();}}
function write(c,id,fn,isDel){
  const k=c+'/'+id;
  const ok=()=>{if(!isDel)markPending(c,id,false);};
  chains[k]=(chains[k]||Promise.resolve()).then(fn).then(ok).catch(e=>{
    if(e&&e.code==='unavailable')return new Promise(r=>setTimeout(r,800+Math.random()*1200)).then(fn).then(ok).catch(e2=>fail(e2,c,id,isDel));
    fail(e,c,id,isDel);
  });
}
function fail(e,c,id,isDel){
  console.warn('save failed',e);
  if(!isDel)markPending(c,id,true); setSync('err');
  if(e&&e.code==='quota_exceeded')toast('Cloud storage is full — remove some photos');
}
function put(c,id,obj){
  obj=clean(obj); obj._pending=true;
  S[c][id]=obj; saveLocal(); render();
  if(be){const o=clean(obj);write(c,id,()=>be.set(c,id,o));}
}
function del(c,id){
  delete S[c][id]; recentDel[c+'/'+id]=Date.now(); saveLocal(); render();
  if(be)write(c,id,()=>be.del(c,id),true);
}
function flushPending(){
  if(!be)return;
  for(const c of COLLS)for(const [id,v] of Object.entries(S[c]))if(v&&v._pending){const o=clean(v);write(c,id,()=>be.set(c,id,o));}
}
function applyRemote(c,m){
  const now=Date.now();
  for(const id of Object.keys(m))if(recentDel[c+'/'+id]&&now-recentDel[c+'/'+id]<90000)delete m[id];
  for(const [id,v] of Object.entries(S[c]))if(v&&v._pending)m[id]=v;
  S[c]=m; saveLocal(); render();
}
function claudeBackend(d){return{name:'claude',
  set:(c,id,o)=>d.doc(c+'/'+id).set(o), del:(c,id)=>d.doc(c+'/'+id).delete(),
  start(onColl,onOk,onErr){for(const c of COLLS){d.collection(c).onSnapshot(snap=>{const m={};snap.docs.forEach(x=>{m[x.id]=x.data();});onColl(c,m);if(!snap.metadata.fromCache)onOk();},onErr);}}
};}
function sheetBackend(url){
  let inflight=0;
  const post=async b=>{inflight++;try{
      const r=await fetch(url,{method:'POST',body:JSON.stringify(b)});const j=await r.json();
      if(!j.ok)throw {code:'sheet',message:j.error||'error'};
    }catch(e){throw (e&&e.code)?e:{code:'unavailable',message:String(e)};}finally{inflight--;}};
  return{name:'sheet',
    set:(c,id,o)=>post({a:'put',c,id,d:o}), del:(c,id)=>post({a:'del',c,id}),
    start(onColl,onOk){
      let busy=false;
      const pull=async()=>{if(busy||inflight)return;busy=true;try{
          const r=await fetch(url+'?a=all&t='+Date.now());const j=await r.json();
          if(!j.ok)throw new Error(j.error);
          if(!inflight){for(const c of COLLS)onColl(c,Object.assign({},j.data[c]||{}));onOk();}
        }catch(e){console.warn(e);setSync('slow');}finally{busy=false;}};
      pull(); setInterval(pull,20000);
      document.addEventListener('visibilitychange',()=>{if(!document.hidden)pull();});
      window.addEventListener('online',pull);
    }};
}
async function connect(){
  let d=null;
  if(typeof claude!=='undefined'&&claude&&claude.use){try{d=await claude.use('db');}catch(e){d=null;}}
  const url=(dev.sheetUrl||SHEET_URL||'').trim();
  if(d)be=claudeBackend(d);
  else if(url)be=sheetBackend(url);
  else{setSync('local');
    if(!Object.keys(S.products).length||(dev.seedV||0)<SEED_VERSION){S.products=JSON.parse(JSON.stringify(SEED_PRODUCTS));dev.seedV=SEED_VERSION;saveDev();saveLocal();render();}
    return;}
  setSync('syncing');
  let first=true;
  const timer=setTimeout(()=>{if(first)setSync('slow');},10000);
  be.start(applyRemote,()=>{setSync('ok');if(first){first=false;clearTimeout(timer);flushPending();}},e=>{clearTimeout(timer);console.warn(e);setSync('err');});
}

const initials=n=>String(n||'?').trim().split(/\s+/).map(w=>w[0]).slice(0,2).join('').toUpperCase();

function fmtTime(t){try{return new Date(t).toLocaleString('en-GB',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});}catch(e){return '';}}
function fmtClock(t){try{return new Date(t).toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});}catch(e){return '';}}
const digits=s=>String(s||'').replace(/[^\d]/g,'');
function toLatinDigits(s){return String(s||'').replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/[۰-۹]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d));}
function normPhone(s){let d=digits(toLatinDigits(s));if(d.startsWith('00'))d=d.slice(2);if(d.startsWith('966'))d='0'+d.slice(3);if(d.length===9&&d.startsWith('5'))d='0'+d;return d;}
function waNumber(p){let d=normPhone(p);if(d.startsWith('05'))return '966'+d.slice(1);return d;}
function soldMap(){const m={};for(const s of Object.values(S.sales))m[s.pid]=(m[s.pid]||0)+(s.qty||1);return m;}

let toastTimer;
function toast(msg,actLabel,act){
  const t=$('#toast');
  t.innerHTML=`<span>${esc(msg)}</span>`+(actLabel?`<button type="button">${esc(actLabel)}</button>`:'');
  if(actLabel)t.querySelector('button').onclick=()=>{t.classList.remove('show');act();};
  t.classList.add('show'); clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>t.classList.remove('show'),actLabel?6000:2600);
}

function confirmBox(title,body,okLabel){

      el=>el.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{done=true;const v=b.dataset.r==='1';closeSheet();res(v);}),
      ()=>{if(!done)res(false);});
  });
}
function readImage(file,max,png){
  return new Promise((res,rej)=>{
    const fr=new FileReader();
    fr.onload=()=>{const im=new Image();im.onload=()=>{
      const k=Math.min(1,max/Math.max(im.width,im.height));const c=document.createElement('canvas');
      c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);const x=c.getContext('2d');
      if(!png){x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);}
      x.drawImage(im,0,0,c.width,c.height);res(png?c.toDataURL('image/png'):c.toDataURL('image/jpeg',.72));
    };im.onerror=rej;im.src=fr.result;};
    fr.onerror=rej;fr.readAsDataURL(file);
  });
}

/* ---------- stock actions ---------- */
function sell(id,size){
  const p=S.products[id]; if(!p)return;
  if(tracked(p)&&stockOf(p)<=0){toast('None left in stock');return;}
  if(hasSizes(p)&&!size){
    const av=availSizes(p);
    if(av.length===1){size=av[0];}
    else{openSheet(`<h3>Which size sold?</h3><p class="note">${esc(p.name)}</p><div class="chips" style="gap:10px">${av.map(z=>`<button class="chip big" data-z="${esc(z)}">${esc(z)}${p.sizes[z]>1?` <small>×${p.sizes[z]}</small>`:''}</button>`).join('')}</div><div class="btnrow"><button class="btn ghost" data-x>Cancel</button></div>`,el=>{
      el.querySelector('[data-x]').onclick=closeSheet;
      el.querySelectorAll('[data-z]').forEach(b=>b.onclick=()=>{closeSheet();sell(id,b.dataset.z);});});return;}
  }
  const saleId=uid(); let n;
  if(hasSizes(p)){const sz=Object.assign({},p.sizes);sz[size]=Math.max(0,(sz[size]||0)-1);n=withStock(Object.assign({},p,{sizes:sz}));put('products',id,n);}
  else if(tracked(p)){n=Object.assign({},p,{stock:p.stock-1});put('products',id,n);}
  put('sales',saleId,{pid:id,name:p.name,price:sellPrice(p),qty:1,at:Date.now(),size:size||null});
  toast(`Sold: ${p.name}${size?' · '+size:''}`+(n?` · ${stockOf(n)} left`:''),'Undo',()=>undoSale(saleId));
}
function undoSale(sid){
  const s=S.sales[sid]; if(!s)return;
  del('sales',sid);
  const p=S.products[s.pid];
  if(p&&hasSizes(p)&&s.size!=null){const sz=Object.assign({},p.sizes);sz[s.size]=(sz[s.size]||0)+(s.qty||1);put('products',s.pid,withStock(Object.assign({},p,{sizes:sz})));}
  else if(p&&typeof p.stock==='number')put('products',s.pid,Object.assign({},p,{stock:p.stock+(s.qty||1)}));
  toast('Sale undone');
}
function adjust(id,d){
  const p=S.products[id]; if(!p)return;
  const cur=tracked(p)?p.stock:0; const n=Math.max(0,cur+d);
  if(tracked(p)&&n===p.stock)return;
  put('products',id,Object.assign({},p,{stock:n}));
}

/* ---------- export ---------- */
function csv(rows){return rows.map(r=>r.map(v=>{v=String(v==null?'':v);return /[",\r\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;}).join(',')).join('\r\n');}
const xlText=v=>v?`="${v}"`:''; // keeps leading 0 in Excel
async function exportFile(name,text){
  const data='﻿'+text; let dl=null;
  try{dl=(typeof claude!=='undefined'&&claude.use)?await claude.use('downloads'):null;}catch(e){dl=null;}
  if(dl){try{await dl.save({filename:name,data});return;}catch(e){console.warn(e);}}
  if(typeof claude==='undefined'){try{const u=URL.createObjectURL(new Blob([data],{type:'text/csv;charset=utf-8'}));const a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000);return;}catch(e){console.warn(e);}}
  openSheet(`<h3>Copy your data</h3><p class="note">Download isn't available here. Copy this and paste it into Excel or Google Sheets.</p><textarea id="x-t" rows="10" readonly style="font-size:12px">${esc(text)}</textarea><div class="btnrow"><button class="btn ghost" data-x>Close</button><button class="btn primary" data-c>Copy</button></div>`,el=>{
    el.querySelector('[data-x]').onclick=closeSheet;
    el.querySelector('[data-c]').onclick=async()=>{try{await navigator.clipboard.writeText(text.replace(/="(.*?)"/g,'$1'));toast('Copied');}catch(e){const t=el.querySelector('#x-t');t.select();toast('Select all and copy');}};
  });
}
const stamp=()=>new Date().toISOString().slice(0,10);
function exportCustomers(){
  const rows=[['Name','Phone','WhatsApp','Size','Pieces liked','Notes','Visits','Signed up']];
  for(const c of customers())rows.push([c.name,xlText(c.phone),xlText(waNumber(c.phone)),c.size||'',(c.liked||[]).join(' | '),c.notes||'',c.visits||1,fmtTime(c.at)]);
  exportFile(`right-left-customers-${stamp()}.csv`,csv(rows));
}
function exportSales(){
  const rows=[['Time','Piece','Size','Price (SAR)']];
  for(const s of sales().slice().reverse())rows.push([fmtTime(s.at),s.name,s.size||'',hasPrice(s.price)?s.price:'']);
  const total=sales().reduce((a,s)=>a+(hasPrice(s.price)?s.price:0),0);
  rows.push([],['Total','', '',total]);
  rows.push([],['Stock left','Piece','Sizes left','Count']); for(const p of products())rows.push(['',p.name,availSizes(p).map(z=>p.sizes[z]>1?z+' x'+p.sizes[z]:z).join(' | '),tracked(p)?stockOf(p):'']);
  exportFile(`right-left-sales-${stamp()}.csv`,csv(rows));
}

    el.querySelector('#s-save').onclick=()=>{put('settings','brand',Object.assign({},b,{logo,showStock:el.querySelector('#s-show').checked}));closeSheet();toast('Saved');};
  });
}

/* ---------- events ---------- */
const acts={
  go:id=>go(id),
  size:id=>{pickSize=pickSize===id?null:id;renderSignupChips();},
  like:id=>{pickLiked.has(id)?pickLiked.delete(id):pickLiked.add(id);renderSignupChips();},
  sell:id=>sell(id), inc:id=>adjust(id,1), dec:id=>adjust(id,-1),
  'undo-sale':id=>undoSale(id),
  'edit-product':id=>editProduct(id), 'add-product':()=>editProduct(null),
  'edit-customer':id=>editCustomer(id),
  'copy-phone':async id=>{const c=S.customers[id];if(!c)return;try{await navigator.clipboard.writeText(c.phone);toast('Number copied');}catch(e){toast(c.phone);}},
  'export-customers':exportCustomers, 'export-sales':exportSales,
  settings:settings, 'kiosk-on':kioskOn, unlock:unlock,
};
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b||b.disabled)return;const f=acts[b.dataset.act];if(f){e.preventDefault();f(b.dataset.id,b);}});
$('#cust-search').addEventListener('input',renderCustomers);

showView(); render(); connect();
})();
</script>
</body>
</html>
